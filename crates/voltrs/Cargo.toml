[package]
name = "voltrs"
description = "Rust runtime for volt.rs: SSR, server actions, loaders and API routes for React apps"
keywords = ["react", "ssr", "web", "framework", "nextjs"]
categories = ["web-programming::http-server"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = ["images"]
## Image optimization endpoint at `/_volt/image`.
images = ["dep:image", "dep:base64", "dep:hyper-rustls", "dep:tower-service", "hyper-util/client-legacy", "hyper-util/http1", "hyper-util/http2"]

[dev-dependencies]
serde.workspace = true

[dependencies]
voltrs-macros.workspace = true
bytes.workspace = true
memchr.workspace = true
regex.workspace = true
flume = { workspace = true, features = ["select"] }
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
inventory.workspace = true
percent-encoding.workspace = true
rquickjs.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
flate2 = { workspace = true }
image = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
hyper-rustls = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }

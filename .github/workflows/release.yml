name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, npm: linux-x64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, npm: linux-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, npm: darwin-x64 }
          - { os: macos-14, target: aarch64-apple-darwin, npm: darwin-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, npm: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p voltrs-cli --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/volt$ext" "dist/volt-${{ matrix.npm }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: volt-${{ matrix.npm }}
          path: dist/*

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/npm-platforms.js dist npm
          publish() {
            name=$(node -p "require('./$1/package.json').name"); version=$(node -p "require('./$1/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version already published"; else npm publish "./$1" --access public; fi
          }
          for dir in npm/*/; do publish "${dir%/}"; done
          publish packages/volt-rs
          publish packages/create-volt-rs
      - uses: dtolnay/rust-toolchain@stable
      - name: crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          for crate in voltrs-macros voltrs voltrs-cli; do
            if curl -sf -A "volt.rs release" "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then echo "$crate $version already published"; else cargo publish -p "$crate"; fi
          done

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  e2e:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p voltrs-cli
      - name: scaffold
        run: |
          target/debug/volt new "$RUNNER_TEMP/app" --no-install
          cd "$RUNNER_TEMP/app"
          sed -i "s|\"volt-rs\": \"^.*\"|\"volt-rs\": \"file:$GITHUB_WORKSPACE/packages/volt-rs\"|" package.json
          sed -i "s|^voltrs = \".*\"|voltrs = { path = \"$GITHUB_WORKSPACE/crates/voltrs\" }|" Cargo.toml
          npm install --install-links
      - name: build
        working-directory: ${{ runner.temp }}/app
        run: $GITHUB_WORKSPACE/target/debug/volt build
      - name: serve
        working-directory: ${{ runner.temp }}/app
        run: |
          PORT=3000 ./target/release/app &
          for i in $(seq 1 50); do curl -sf localhost:3000/ > /dev/null && break; sleep 0.2; done
          curl -sf localhost:3000/ | grep -q "<title>Todos"
          curl -sf localhost:3000/about | grep -q "<title>About"
          curl -s -o /dev/null -w "%{http_code}" localhost:3000/missing | grep -q 404
          curl -sf -X POST -H "content-type: application/json" -d '{"title":"ci"}' localhost:3000/_volt/action/add_todo | grep -q '"title":"ci"'
          curl -sf localhost:3000/sitemap.xml | grep -q "<loc>"
          curl -sf localhost:3000/api/health | grep -q ok
      - name: browser
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:3000 npm test

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
authors = ["redstone-md"]
repository = "https://github.com/redstone-md/volt.rs"
homepage = "https://github.com/redstone-md/volt.rs"
rust-version = "1.88"

[workspace.dependencies]
voltrs = { path = "crates/voltrs", version = "0.0.1" }
voltrs-macros = { path = "crates/voltrs-macros", version = "0.0.1" }
anyhow = "1"
arcstr = "1"
brotli = { version = "8", default-features = false, features = ["std"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
grass = { version = "0.13", default-features = false }
flume = { version = "0.11", default-features = false }
http = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
imagesize = "0.14"
include_dir = "0.7"
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["browserslist", "bundler"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"] }
inventory = "0.3"
memchr = "2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
oxc_allocator = "0.158"
oxc_ast = "0.158"
oxc_ast_visit = "0.158"
oxc_parser = "0.158"
oxc_span = "0.158"
percent-encoding = "2"
proc-macro2 = "1"
quote = "1"
rolldown = "1.3.2"
rolldown_common = "1.3.2"
rolldown_error = "1.3.2"
rolldown_sourcemap = "1.3.2"
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
string_wizard = "1.3.2"
syn = { version = "2", features = ["full", "extra-traits"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "macros", "signal", "sync", "time", "process", "io-util"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

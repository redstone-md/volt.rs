[workspace]
resolver = "3"
members = ["crates/voltrs", "crates/voltrs-macros"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
authors = ["redstone-md"]
repository = "https://github.com/redstone-md/volt.rs"
homepage = "https://github.com/redstone-md/volt.rs"
rust-version = "1.88"

[workspace.dependencies]
voltrs = { path = "crates/voltrs", version = "0.0.1" }
voltrs-macros = { path = "crates/voltrs-macros", version = "0.0.1" }
bytes = "1"
flate2 = "1"
flume = { version = "0.11", default-features = false }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"] }
inventory = "0.3"
percent-encoding = "2"
proc-macro2 = "1"
quote = "1"
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "macros", "signal", "sync", "time", "process", "io-util"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
